<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="No Distractions is a quiet player and library for YouTube lectures and courses. Notes pinned to timestamps, bookmarks, resumable progress, and nothing else competing for your attention."
    />
    <title>No Distractions | Learn from YouTube. Without the distractions.</title>
    <script>
      // Sets the theme BEFORE first paint so a dark-mode user never sees a
      // white flash while React boots. Must stay in sync with
      // src/context/theme-context.ts (same storage key, same resolution
      // rule); the ThemeProvider takes over once React mounts.
      (function () {
        try {
          var stored = window.localStorage.getItem('nd-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage or matchMedia unavailable: the light default applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
